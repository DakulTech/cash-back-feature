spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cash-back
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway manages schema, not Hibernate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

  redis:
    host: localhost
    port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration

cashback:
  # Keep the Redis duplicate-processing window within one or two daily reconciliation cycles.
  transaction-eligibility-ttl: 48h
  referral-cache-ttl: 30d
  referral-local-max-bonus: 8000
  referral-uk-max-bonus: 10000
  outbox:
    worker-enabled: false

warehouse:
  redshift:
    namespace-arn: ${REDSHIFT_NAMESPACE_ARN}
    region: ${AWS_REGION}
  datasource:
    url: ${REDSHIFT_JDBC_URL}
    username: ${REDSHIFT_DB_USERNAME}
    password: ${REDSHIFT_DB_PASSWORD}
    driver-class-name: ${WAREHOUSE_DATASOURCE_DRIVER_CLASS_NAME}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: cashback-rewards

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317
  resource:
    attributes:
      service.name: cashback-rewards

---
spring:
  config:
    activate:
      on-profile: prod
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.threadPool.threadCount: 10
