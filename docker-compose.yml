services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: cash-back
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cash-back"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  warehouse:
    image: postgres:18
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD in the environment}
    ports:
      - "5433:5432"
    volumes:
      - warehouse-data-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cash-back
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      REDSHIFT_JDBC_URL: jdbc:postgresql://warehouse:5432/warehouse
      REDSHIFT_DB_USERNAME: warehouse
      REDSHIFT_DB_PASSWORD: ${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD in the environment}
      WAREHOUSE_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      REDSHIFT_NAMESPACE_ARN: local-compose-warehouse
      AWS_REGION: eu-north-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      warehouse:
        condition: service_healthy

  worker:
    image: cash-back-feature-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cash-back
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      REDSHIFT_JDBC_URL: jdbc:postgresql://warehouse:5432/warehouse
      REDSHIFT_DB_USERNAME: warehouse
      REDSHIFT_DB_PASSWORD: ${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD in the environment}
      WAREHOUSE_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      REDSHIFT_NAMESPACE_ARN: local-compose-warehouse
      AWS_REGION: eu-north-1
      SPRING_PROFILES_ACTIVE: worker
      CASHBACK_OUTBOX_WORKER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      warehouse:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./src/main/java/com/example/cashback/observability/prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    depends_on:
      app:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports:
      - "9093:9093"
    volumes:
      - ./src/main/java/com/example/cashback/observability/prometheus/alertmanager-local.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./src/main/java/com/example/cashback/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres-data-v18:
  redis-data:
  warehouse-data-v18:
